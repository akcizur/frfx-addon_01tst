<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nastavení – Firefox Sidebar Connector</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <p class="eyebrow">FIREFOX WEBEXTENSION · MV3</p>
    <h1>Nastavení sidebaru</h1>
    <p class="intro">
      Určete URL, režim zobrazení a chování doplňku. Nastavení se ukládá přes
      browser.storage.sync.
    </p>

    <form id="settings-form">
      <fieldset>
        <legend>Cílový obsah</legend>

        <label for="target-url">
          Cílová URL
          <input
            id="target-url"
            name="targetUrl"
            type="url"
            required
            inputmode="url"
            autocomplete="url"
            placeholder="https://example.com/"
          >
          <p class="hint">
            Povolené jsou HTTPS adresy. HTTP je povoleno pouze pro localhost a lokální vývojové adresy.
          </p>
        </label>

        <label for="display-mode">
          Režim zobrazení
          <select id="display-mode" name="displayMode">
            <option value="sidebarAction.setPanel">Přímý sidebarAction.setPanel</option>
            <option value="iframe">Lokální panel + sandboxovaný iframe</option>
          </select>
          <p class="hint">
            Přímý režim obvykle obejde omezení webu proti iframe. Iframe režim je vhodný pro případy,
            kdy potřebujete vlastní obal panelu.
          </p>
        </label>
      </fieldset>

      <fieldset>
        <legend>Chování</legend>

        <div class="switches">
          <label class="switch">
            <span>
              <strong>Doplněk zapnutý</strong>
              <small>Aktivně zobrazovat cílový obsah.</small>
            </span>
            <input id="enabled" name="enabled" type="checkbox">
          </label>

          <label class="switch">
            <span>
              <strong>Zobrazovat stav</strong>
              <small>V iframe režimu zobrazit stavový řádek načítání.</small>
            </span>
            <input id="show-status" name="showStatus" type="checkbox">
          </label>
        </div>
      </fieldset>

      <div class="actions">
        <div id="status" role="status" aria-live="polite"></div>
        <div>
          <button class="secondary" id="defaults" type="button">Výchozí</button>
          <button type="submit">Uložit nastavení</button>
        </div>
      </div>
    </form>
  </main>

  <script src="options.js"></script>
</body>
</html>
