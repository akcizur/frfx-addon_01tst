<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nastavení – Firefox Sidebar Connector</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 0%, color-mix(in srgb, CanvasText 8%, transparent), transparent 30%),
        Canvas;
    }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 48px auto;
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 11px;
      letter-spacing: .13em;
      opacity: .55;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1;
    }

    .intro {
      margin: 12px 0 28px;
      max-width: 60ch;
      line-height: 1.55;
      opacity: .72;
    }

    form,
    fieldset,
    .actions {
      border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
      border-radius: 16px;
      background: color-mix(in srgb, Canvas 96%, CanvasText 4%);
    }

    fieldset {
      margin: 0 0 16px;
      padding: 18px;
    }

    legend {
      padding: 0 7px;
      font-weight: 650;
    }

    label {
      display: grid;
      gap: 7px;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
    }

    input[type="url"],
    select {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
      border-radius: 10px;
      background: Canvas;
      color: inherit;
      font: inherit;
    }

    .hint {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
      opacity: .64;
      font-weight: 400;
    }

    .switches {
      display: grid;
      gap: 10px;
      margin-top: 4px;
    }

    .switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0;
      padding: 12px;
      border: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
      border-radius: 12px;
    }

    .switch span {
      display: grid;
      gap: 3px;
    }

    .switch strong {
      font-size: 13px;
    }

    .switch small {
      font-size: 11px;
      opacity: .62;
    }

    .switch input {
      width: 18px;
      height: 18px;
      margin: 0;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
    }

    button {
      min-height: 40px;
      padding: 9px 14px;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 10px;
      background: CanvasText;
      color: Canvas;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button.secondary {
      background: transparent;
      color: inherit;
    }

    #status {
      min-height: 20px;
      font-size: 12px;
      opacity: .72;
    }

    #status.error {
      color: #b00020;
      opacity: 1;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">FIREFOX WEBEXTENSION · MV3</p>
    <h1>Nastavení sidebaru</h1>
    <p class="intro">
      Určete URL, režim zobrazení a chování doplňku. Nastavení se ukládá přes
      browser.storage.sync.
    </p>

    <form id="settings-form">
      <fieldset>
        <legend>Cílový obsah</legend>

        <label for="target-url">
          Cílová URL
          <input
            id="target-url"
            name="targetUrl"
            type="url"
            required
            inputmode="url"
            autocomplete="url"
            placeholder="https://example.com/"
          >
          <p class="hint">
            Povolené jsou HTTPS adresy. HTTP je povoleno pouze pro localhost a lokální vývojové adresy.
          </p>
        </label>

        <label for="display-mode">
          Režim zobrazení
          <select id="display-mode" name="displayMode">
            <option value="sidebarAction.setPanel">Přímý sidebarAction.setPanel</option>
            <option value="iframe">Lokální panel + sandboxovaný iframe</option>
          </select>
          <p class="hint">
            Přímý režim obvykle obejde omezení webu proti iframe. Iframe režim je vhodný pro případy,
            kdy potřebujete vlastní obal panelu.
          </p>
        </label>
      </fieldset>

      <fieldset>
        <legend>Chování</legend>

        <div class="switches">
          <label class="switch">
            <span>
              <strong>Doplněk zapnutý</strong>
              <small>Aktivně zobrazovat cílový obsah.</small>
            </span>
            <input id="enabled" name="enabled" type="checkbox">
          </label>

          <label class="switch">
            <span>
              <strong>Otevřít po instalaci</strong>
              <small>Otevřít sidebar při první instalaci.</small>
            </span>
            <input id="open-on-install" name="openOnInstall" type="checkbox">
          </label>

          <label class="switch">
            <span>
              <strong>Zobrazovat stav</strong>
              <small>V iframe režimu zobrazit stavový řádek načítání.</small>
            </span>
            <input id="show-status" name="showStatus" type="checkbox">
          </label>
        </div>
      </fieldset>

      <div class="actions">
        <div id="status" role="status" aria-live="polite"></div>
        <div>
          <button class="secondary" id="defaults" type="button">Výchozí</button>
          <button type="submit">Uložit nastavení</button>
        </div>
      </div>
    </form>
  </main>

  <script src="options.js"></script>
</body>
</html>
